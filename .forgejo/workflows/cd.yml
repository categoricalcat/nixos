name: Continuous Deployment
run-name: 'Deploy ${{ inputs.host || github.event.inputs.host }} (${{ inputs.step || github.event.inputs.step }})'

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Target Host'
        required: true
        type: choice
        options:
          - yixiaoqing
          - yitaishi
          - yifuwuqi
          - yirukou
      step:
        description: 'Pipeline Step'
        required: true
        type: choice
        default: '1-diff'
        options:
          - '1-diff'
          - '2-deploy'

concurrency:
  group: ${{ format('deploy-{0}', inputs.host || github.event.inputs.host) }}
  cancel-in-progress: false

jobs:
  diff:
    name: 'Step 1: Dry-Run & Diff'
    runs-on: native
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main
      - name: Dry-activate ${{ inputs.host }}
        run: ci/deploy.sh dry-activate ${{ inputs.host }}
      - name: Diff package closures with nvd
        run: ci/deploy.sh diff ${{ inputs.host }}

  deploy:
    name: 'Step 2: Live Activation & Magic Rollback'
    needs: [diff]
    if: inputs.step == '2-deploy'
    runs-on: native
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main
      - name: Deploy ${{ inputs.host }}
        run: ci/deploy.sh deploy ${{ inputs.host }}
