name: flake deploies
run-name: "CD: ${{ inputs.action }} (@${{ github.actor }})"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Deployment Action"
        required: true
        type: choice
        default: "dry"
        options:
          - "dry"
          - "switch"
          - "boot"

      all:
        description: "Deploy all hosts"
        type: boolean
        default: false
      yixiaoqing:
        description: "Deploy yixiaoqing"
        type: boolean
        default: false
      yitaishi:
        description: "Deploy yitaishi"
        type: boolean
        default: false
      yifuwuqi:
        description: "Deploy yifuwuqi"
        type: boolean
        default: false
      yirukou:
        description: "Deploy yirukou"
        type: boolean
        default: false

concurrency:
  group: cd-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: "Preflight & Activate (${{ inputs.action }})"
    runs-on: native
    timeout-minutes: 120
    env:
      CLICOLOR_FORCE: "1"
      FORCE_COLOR: "1"
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Resolve target hosts
        id: targets
        run: |
          TARGETS=()
          [ "${{ inputs.all }}" = "true" ] && TARGETS+=(all)
          [ "${{ inputs.yixiaoqing }}" = "true" ] && TARGETS+=(yixiaoqing)
          [ "${{ inputs.yitaishi }}" = "true" ] && TARGETS+=(yitaishi)
          [ "${{ inputs.yifuwuqi }}" = "true" ] && TARGETS+=(yifuwuqi)
          [ "${{ inputs.yirukou }}" = "true" ] && TARGETS+=(yirukou)

          if [ "${#TARGETS[@]}" -eq 0 ]; then
            echo "::error::No target hosts selected! Please check at least one host." >&2
            exit 1
          fi

          printf 'Target hosts: %s\n' "${TARGETS[*]}"
          echo "hosts=${TARGETS[*]}" >> "$GITHUB_OUTPUT"

      # Each step only gets the hosts that passed the previous one: a failing host fails
      # the run without holding back the rest. Forgejo drops the outputs of failed jobs,
      # so preflight and activation must share one job.
      - id: gate
        run: ci/deploy.sh gate ${{ steps.targets.outputs.hosts }}

      - id: dry
        if: ${{ !cancelled() && steps.gate.outputs.hosts != '' }}
        run: ci/deploy.sh dry-activate ${{ steps.gate.outputs.hosts }}

      - id: diff
        if: ${{ !cancelled() && steps.dry.outputs.hosts != '' }}
        run: ci/deploy.sh diff ${{ steps.dry.outputs.hosts }}

      - if: ${{ !cancelled() }}
        run: bash nix/scripts/lock-to-changelog.sh || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy configuration (${{ inputs.action }})
        if: ${{ !cancelled() && steps.diff.outputs.hosts != '' && (inputs.action == 'switch' || inputs.action == 'boot') }}
        run: ci/deploy.sh ${{ inputs.action }} ${{ steps.diff.outputs.hosts }}
