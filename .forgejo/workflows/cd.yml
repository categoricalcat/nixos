name: Continuous Deployment
run-name: 'Deploy ${{ inputs.host || github.event.inputs.host }} (${{ inputs.action || inputs.step || github.event.inputs.action || github.event.inputs.step }})'

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Target Host'
        required: true
        type: choice
        options:
          - yixiaoqing
          - yitaishi
          - yifuwuqi
          - yirukou
      action:
        description: 'Deployment Action'
        required: true
        type: choice
        default: 'dry'
        options:
          - 'dry'
          - 'switch'
          - 'boot'

concurrency:
  group: ${{ format('deploy-{0}', inputs.host || github.event.inputs.host) }}
  cancel-in-progress: false

jobs:
  diff:
    name: 'Step 1: Dry-Run & Diff'
    runs-on: native
    timeout-minutes: 60
    steps:
      - uses: https://github.com/actions/checkout@main
      - name: Require ${{ inputs.host }} closure in attic
        run: ci/deploy.sh gate ${{ inputs.host }}
      - name: Dry-activate ${{ inputs.host }}
        run: ci/deploy.sh dry-activate ${{ inputs.host }}
      - name: Diff package closures with nvd
        run: ci/deploy.sh diff ${{ inputs.host }}
      - name: Flake lock changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash nix/scripts/lock-to-changelog.sh || true

  deploy:
    name: 'Step 2: Activation / Bootloader Update'
    needs: [diff]
    if: (inputs.action || inputs.step || github.event.inputs.action || github.event.inputs.step) == 'switch' || (inputs.action || inputs.step || github.event.inputs.action || github.event.inputs.step) == 'boot' || (inputs.action || inputs.step || github.event.inputs.action || github.event.inputs.step) == '2-deploy'
    runs-on: native
    timeout-minutes: 60
    steps:
      - uses: https://github.com/actions/checkout@main
      - name: Deploy ${{ inputs.host }}
        run: ci/deploy.sh ${{ inputs.action || inputs.step || github.event.inputs.action || github.event.inputs.step }} ${{ inputs.host }}
