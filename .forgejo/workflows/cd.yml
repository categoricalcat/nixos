name: Continuous Deployment
run-name: 'CD: ${{ inputs.host }} (${{ inputs.action }})'

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Target Host'
        required: true
        type: choice
        options:
          - yixiaoqing
          - yitaishi
          - yifuwuqi
          - yirukou
      action:
        description: 'Deployment Action'
        required: true
        type: choice
        default: 'dry'
        options:
          - 'dry'
          - 'switch'
          - 'boot'

concurrency:
  group: deploy-${{ inputs.host }}
  cancel-in-progress: false

jobs:
  diff:
    name: 'Preflight & Diff (${{ inputs.host }})'
    runs-on: native
    timeout-minutes: 60
    env:
      CLICOLOR_FORCE: "1"
      FORCE_COLOR: "1"
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@main
      - name: Verify closure in Attic
        run: ci/deploy.sh gate ${{ inputs.host }}
      - name: Dry-activate configuration
        run: ci/deploy.sh dry-activate ${{ inputs.host }}
      - name: Diff package closures (nvd)
        run: ci/deploy.sh diff ${{ inputs.host }}
      - name: Flake lock changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash nix/scripts/lock-to-changelog.sh || true

  deploy:
    name: 'Activate ${{ inputs.host }} (${{ inputs.action }})'
    needs: [diff]
    if: inputs.action == 'switch' || inputs.action == 'boot'
    runs-on: native
    timeout-minutes: 60
    env:
      CLICOLOR_FORCE: "1"
      FORCE_COLOR: "1"
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@main
      - name: Deploy configuration (${{ inputs.action }})
        run: ci/deploy.sh ${{ inputs.action }} ${{ inputs.host }}
