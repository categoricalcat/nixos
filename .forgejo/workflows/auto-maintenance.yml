name: Auto Maintenance
run-name: 'Auto-maintenance summon (@${{ github.actor }})'

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5,17 * * *'

concurrency:
  group: auto-maintenance
  cancel-in-progress: false

jobs:
  run:
    name: Prepare flake update
    runs-on: native
    timeout-minutes: 500
    steps:
      - name: Checkout develop
        uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false
      - name: Summon maintenance agent
        env:
          AGY_OAUTH_TOKEN: ${{ secrets.AGY_OAUTH_TOKEN }}
          AUTO_MAINTENANCE_TOKEN: ${{ secrets.AUTO_MAINTENANCE_TOKEN }}
        run: ci/auto-maintenance.sh
