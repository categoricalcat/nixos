name: Deploies

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Target Host'
        required: true
        type: choice
        options:
          - yixiaoqing
          - yitaishi
          - yifuwuqi
          - yirukou
      step:
        description: 'Pipeline Step'
        required: true
        type: choice
        default: '1-diff'
        options:
          - '1-diff'
          - '2-deploy'

concurrency:
  group: deploy-${{ inputs.host }}

jobs:
  diff:
    name: 'Step 1: Dry-Run & Diff'
    runs-on: native
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main
      - name: Dry-activate ${{ inputs.host }}
        run: deploy .#"${{ inputs.host }}" --dry-activate
      - name: Diff package closures with nvd
        run: |
          TARGET_IP=$(nix eval --raw ".#deploy.nodes.${{ inputs.host }}.hostname")
          NEW_SYSTEM=$(nix eval --raw ".#nixosConfigurations.${{ inputs.host }}.config.system.build.toplevel")
          ssh -i /var/lib/nix-builder/.ssh/id_ed25519 -p 24212 -o StrictHostKeyChecking=accept-new root@"$TARGET_IP" \
            "if command -v nvd >/dev/null 2>&1; then nvd diff /run/current-system \"$NEW_SYSTEM\"; elif [ -x \"$NEW_SYSTEM/sw/bin/nvd\" ]; then \"$NEW_SYSTEM/sw/bin/nvd\" diff /run/current-system \"$NEW_SYSTEM\"; else nix-store --diff-closures /run/current-system \"$NEW_SYSTEM\"; fi"

  deploy:
    name: 'Step 2: Live Activation & Magic Rollback'
    needs: [diff]
    if: inputs.step == '2-deploy'
    runs-on: native
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main
      - name: Deploy ${{ inputs.host }}
        run: deploy .#"${{ inputs.host }}" --print-build-logs
