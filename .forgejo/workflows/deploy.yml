name: Deploy Fleet

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Target Host'
        required: true
        type: choice
        options:
          - yixiaoqing
          - yitaishi
          - yifuwuqi
          - yirukou
      step:
        description: 'Pipeline Step'
        required: true
        type: choice
        default: '1-diff'
        options:
          - '1-diff'
          - '2-deploy'

concurrency:
  group: deploy-${{ inputs.host }}

jobs:
  diff:
    name: 'Step 1: Dry-Run & Diff'
    runs-on: native
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main
      - name: Diff package closures with nvd
        run: |
          TARGET_IP=$(nix eval --raw ".#deploy.nodes.${{ inputs.host }}.hostname")
          CURRENT_SYSTEM=$(ssh -i /var/lib/nix-builder/.ssh/id_ed25519 -p 24212 -o StrictHostKeyChecking=accept-new root@"$TARGET_IP" "readlink -f /run/current-system")
          NEW_SYSTEM=$(nix build ".#nixosConfigurations.${{ inputs.host }}.config.system.build.toplevel" --no-link --print-out-paths)
          nvd diff "$CURRENT_SYSTEM" "$NEW_SYSTEM"
      - name: Dry-activate ${{ inputs.host }}
        run: deploy .#"${{ inputs.host }}" --dry-activate

  deploy:
    name: 'Step 2: Live Activation & Magic Rollback'
    needs: [diff]
    if: inputs.step == '2-deploy'
    runs-on: native
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main
      - name: Deploy ${{ inputs.host }}
        run: deploy .#"${{ inputs.host }}" --print-build-logs
