name: integrates
run-name: "CI: ${{ github.event.head_commit.message || github.ref_name }} (@${{ github.actor }})"

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  build:
    name: Build & Cache
    runs-on: native
    timeout-minutes: 500
    env:
      CLICOLOR_FORCE: "1"
      FORCE_COLOR: "1"

    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - run: ci/build.sh
        env:
          ATTIC_TOKEN: ${{ secrets.attic_token }}
          CI: "1"
