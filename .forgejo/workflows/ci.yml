name: Continuous Integration for 伊的flake~

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: native
    timeout-minutes: 500
    steps:
      - uses: https://github.com/actions/checkout@main
      - name: nix-fast-build hydraJobs
        env:
          ATTIC_TOKEN: ${{ secrets.attic_token }}
          CI: "1"
        run: ci/build.sh
