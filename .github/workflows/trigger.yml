name: trigger woodpecker

on:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  trigger:
    if: github.actor == github.repository_owner
    timeout-minutes: 10
    runs-on: self-hosted
    steps:
      - name: load nix environment
        run: setup-ci-env
      - name: sync mirror and trigger woodpecker
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          WOODPECKER_TOKEN: ${{ secrets.WOODPECKER_TOKEN }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          curl -fsS -X POST -H "Authorization: token $FORGEJO_TOKEN" \
            "$FORGEJO_INTERNAL_URL/api/v1/repos/$GITHUB_REPO/mirror-sync"
          for _ in $(seq 1 60); do
            cur=$(curl -fsS -H "Authorization: token $FORGEJO_TOKEN" \
              "$FORGEJO_INTERNAL_URL/api/v1/repos/$GITHUB_REPO/branches/$BRANCH" | jq -r .commit.id)
            if [ "$cur" = "$SHA" ]; then
              break
            fi
            sleep 5
          done
          if [ "$cur" != "$SHA" ]; then
            echo "mirror sync did not reach $SHA (got $cur)" >&2
            exit 1
          fi
          rid=$(curl -fsS -H "Authorization: Bearer $WOODPECKER_TOKEN" \
            "$WOODPECKER_INTERNAL_URL/api/repos/lookup/$GITHUB_REPO" | jq -r .id)
          curl -fsS -X POST -H "Authorization: Bearer $WOODPECKER_TOKEN" \
            "$WOODPECKER_INTERNAL_URL/api/repos/$rid/pipelines" \
            -d "{\"branch\":\"$BRANCH\"}"
