name: lucky flake ci

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: cachix/install-nix-action@master
      - uses: nix-community/cache-nix-action@main
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}

      - run: nix fmt -- --ci

      - run: nix flake check --print-build-logs --show-trace

  generate-matrix:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.set-matrix.outputs.hosts }}
    steps:
      - uses: actions/checkout@main
      - uses: cachix/install-nix-action@master
      - id: set-matrix
        run: |
          HOSTS="$(nix eval --json .#nixosConfigurations --apply 'cfgs: builtins.attrNames cfgs')"
          echo "hosts=$HOSTS" >> "$GITHUB_OUTPUT"

      - uses: nix-community/cache-nix-action@main
        with:
          primary-key: nix-${{ runner.os }}-${{ join(fromJson(steps.set-matrix.outputs.hosts), '') }}

  eval:
    needs: generate-matrix
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host: ${{ fromJson(needs.generate-matrix.outputs.hosts) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@main
      - uses: cachix/install-nix-action@master
      - uses: nix-community/cache-nix-action@main
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}

      - run: nix eval --raw .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath
