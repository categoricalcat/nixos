cloudflare_api_token: |
    CLOUDFLARE_DNS_API_TOKEN=string
# Fine-grained PAT, Public Repositories (read-only), NO permissions (public rate-limit only). See docs/src/services/secrets.md
nix:
    access-tokens: |
        access-tokens = github.com=<PAT>
passwords:
    yi: string
    workd: string
    nextcloud: string
tokens:
    forgejo-runner: string
    github-runner-nixos: string
    attic-server-jwt-env: |
        ATTIC_SERVER_TOKEN_RS256_SECRET_BASE64=<base64-rsa-key>
    attic-push-token: string
    playit-agent: |
        SECRET_KEY=string
    cloudflared: string
    localtonet-authtoken: string
    deepseek: string

samba:
    credentials:
        yi: |
            username=string
            password=string
services:
    grafana:
        secret-key: string
    proton:
        wireguard_private_key: string
    slskd:
        username: string
        password: string
        web_password: string
        api_key: string
arr:
    radarr_api_key: string
    sonarr_api_key: string
    lidarr_api_key: string
    readarr_api_key: string
    prowlarr_api_key: string
