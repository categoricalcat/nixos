<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmonia Binary Cache</title>
    <style>
        :root {
            --bg-base: #0f172a;
            --bg-panel: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 2rem;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fade-in-down 0.8s ease-out;
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, #38bdf8, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px var(--accent-glow);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 0.5rem;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            animation: fade-in-up 0.8s ease-out;
        }

        .card {
            background: var(--bg-panel);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            opacity: 0.5;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), 0 0 15px var(--accent-glow);
        }

        .card-title {
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .card-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-main);
            transition: color 0.3s;
        }
        
        .card-value.updated {
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse 2s infinite;
        }

        .footer {
            margin-top: 4rem;
            color: var(--text-muted);
            font-size: 0.875rem;
            text-align: center;
            animation: fade-in 1s ease-out 0.5s both;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        @keyframes fade-in-down {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .raw-metrics {
            margin-top: 3rem;
            background: rgba(0,0,0,0.3);
            border-radius: 0.5rem;
            padding: 1rem;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            border: 1px solid var(--border);
            animation: fade-in 1s ease-out 0.8s both;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Harmonia Cache</h1>
            <p class="subtitle"><span class="status-dot"></span>System Online & Serving /nix/store</p>
        </header>

        <div class="dashboard">
            <div class="card">
                <div class="card-title">Total Requests</div>
                <div class="card-value" id="val-requests">0</div>
            </div>
            <div class="card">
                <div class="card-title">Cache Hits</div>
                <div class="card-value" id="val-hits">0</div>
            </div>
            <div class="card">
                <div class="card-title">Bytes Served</div>
                <div class="card-value" id="val-bytes">0</div>
            </div>
        </div>

        <div class="raw-metrics" id="raw-metrics">
            Loading metrics...
        </div>

        <div class="footer">
            Powered by Harmonia & NixOS • cache.fufu.land
        </div>
    </div>

    <script>
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function fetchMetrics() {
            try {
                const res = await fetch('/metrics');
                if (!res.ok) throw new Error('Failed to fetch');
                const text = await res.text();
                
                document.getElementById('raw-metrics').textContent = text;
                
                const lines = text.split('\n');
                let requests = 0;
                let hits = 0;
                let bytes = 0;

                for (const line of lines) {
                    if (line.startsWith('#') || !line) continue;
                    // Basic heuristic parsing for common web server metrics
                    if (line.includes('requests_total') || line.includes('http_requests')) {
                        const val = parseFloat(line.split(' ').pop());
                        if (!isNaN(val)) requests += val;
                    }
                    if (line.includes('hit')) {
                        const val = parseFloat(line.split(' ').pop());
                        if (!isNaN(val)) hits += val;
                    }
                    if (line.includes('bytes')) {
                        const val = parseFloat(line.split(' ').pop());
                        if (!isNaN(val)) bytes += val;
                    }
                }

                updateValue('val-requests', requests.toLocaleString());
                updateValue('val-hits', hits.toLocaleString());
                updateValue('val-bytes', formatBytes(bytes));

            } catch (err) {
                document.getElementById('raw-metrics').textContent = 'Error loading metrics: ' + err.message;
            }
        }

        function updateValue(id, newValue) {
            const el = document.getElementById(id);
            if (el.textContent !== newValue && el.textContent !== '0') {
                el.classList.remove('updated');
                void el.offsetWidth; // trigger reflow
                el.classList.add('updated');
                setTimeout(() => el.classList.remove('updated'), 300);
            }
            el.textContent = newValue;
        }

        fetchMetrics();
        setInterval(fetchMetrics, 5000); // refresh every 5s
    </script>
</body>
</html>
