modules:
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
  icmp6:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip6
      ip_protocol_fallback: false
  dns:
    prober: dns
    timeout: 5s
    dns:
      transport_protocol: udp
      preferred_ip_protocol: ip4
      query_name: example.com
      query_type: A
      valid_rcodes: [NOERROR]
  dns6:
    prober: dns
    timeout: 5s
    dns:
      transport_protocol: udp
      preferred_ip_protocol: ip6
      ip_protocol_fallback: false
      query_name: example.com
      query_type: AAAA
      valid_rcodes: [NOERROR]
  http:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [204]
      follow_redirects: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
