# A vibrant rainbow theme!

format = """
[道 ](fg:#@base08@)\
$os\
$username$hostname\
$directory\
$git_branch\
$git_status\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
$docker_context\
$time\
$line_break\
$character
"""

# Disable the blank line at the start of the prompt
# add_newline = false

[username]
show_always = true
style_user = "fg:#@base08@"
style_root = "fg:#@base08@"
format = '[$user]($style)'
disabled = false

[os]
style = "fg:#@base08@"
disabled = true # Disabled by default

[hostname]
ssh_only = false
style = "fg:#@base08@"
format = "[@$hostname ]($style)"

[directory]
style = "fg:#@base09@"
format = "[$path ]($style)"
truncation_length = 3
truncation_symbol = "径 "

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[c]
style = "fg:#@base0B@"
format = '[($version) ]($style)'

[cpp]
style = "fg:#@base0B@"
format = '[($version) ]($style)'

[docker_context]
style = "fg:#@base0D@"
format = '[$context ]($style)'

[elixir]
style = "fg:#@base0B@"
format = '[($version) ]($style)'

[elm]
style = "fg:#@base0B@"
format = '[($version) ]($style)'

[git_branch]
symbol = "支 "
style = "fg:#@base0A@"
format = '[$symbol$branch ]($style)'

[git_status]
style = "fg:#@base0A@"
format = '[($all_status$ahead_behind )]($style)'

[golang]
style = "fg:#@base0B@"
format = '[$symbol ($version) ]($style)'

[gradle]
style = "fg:#@base0B@"
format = '[$symbol ($version) ]($style)'

[haskell]
style = "fg:#@base0B@"
format = '[$symbol ($version) ]($style)'

[java]
style = "fg:#@base0B@"
format = '[$symbol ($version) ]($style)'

[julia]
style = "fg:#@base0B@"
format = '[$symbol ($version) ]($style)'

[nodejs]
format = '[($version) ](fg:#@base0B@)'

[nim]
style = "fg:#@base0B@"
format = '[($version) ]($style)'

[rust]  
style = "fg:#@base0B@"
format = '[($version) ]($style)'

[scala]
style = "fg:#@base0B@"
format = '[($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "fg:#@base0E@"
format = '[爱 $time]($style)'

[character]
# 入: enter/input; 死: error;
success_symbol = "[入](fg:#@base08@)"
error_symbol = "[死](fg:#@base03@)"
